# Rechnungen aus Lexware Office (Layout GM IT Solutions), Text ohne layout-Modus.
# Auch für Text aus der Texterkennung (Tesseract): Beträge mit Leerzeichen, „.“ statt „,“ vor den Cent, €/EUR,
# verlesene Pos.-Nr. und Tabellenkopf. Beträge werden nie geraten, der Summenabgleich bleibt die Sicherung.
name: lexware-gm-it
schluesselwoerter: ["GM - IT Solutions - Marvin Gawenda", "Rechnungsnr.:", "Zwischensumme (netto)"]
felder:
  # Nummernkreis GM IT: RE + Ziffern, aus der Überschrift (eigene Zeile, große Schrift → auch per
  # Texterkennung sauber). Bewusst eng: die Nummer deckt kein Summenabgleich ab → lieber Fehler als falsch.
  nummer: '^Rechnung (RE\d+)\s*$'
  # Gegenprobe „Rechnungsnr.:“ (kleine Schrift im Kopfblock). Die Texterkennung liest dort 0 als O/O0,
  # setzt Leerzeichen und hängt den Adressblock davor (Edge-Druck, VM 108). Normalisiert wird nur diese
  # Gegenprobe (O0/O → 0, Leerzeichen weg); weicht sie danach ab → Fehler.
  nummer_kontrolle: 'Rechnungsnr\.:\s*(RE[\dO ]*\d)\s*$'
  # O statt 0 ist in einem Datum eindeutig (datum() ersetzt es)
  datum: 'Datum:\s*([\dO]{2}\.[\dO]{2}\.[\dO]{4})'
  leistungsdatum: '(?:Liefer|Leistungs)datum:\s*([\dO]{2}\.[\dO]{2}\.[\dO]{4})'
  # Lexware: Fälligkeit = Rechnungsdatum + N Tage (so steht es auch im DueDate der Lexware-XML)
  zahlungsziel_tage: '^Zahlungsziel (\d+) Tage'
  # Mit Rabatt: „Zwischensumme (netto)“, „abzgl. Rabatt -71,00“, „Gesamt (netto)“ → Netto ist „Gesamt (netto)“
  summe_netto:
    - '^Gesamt ?\(netto\)\s*(\d[\d. ]*[,.] ?\d{2})(?: ?(?:€|EUR))?$'
    - '^Zwischensumme ?\(netto\)\s*(\d[\d. ]*[,.] ?\d{2})(?: ?(?:€|EUR))?$'
  summe_brutto: '^Gesamtbetrag\s+(\d[\d. ]*[,.] ?\d{2})(?: ?(?:€|EUR))?$'
steuern: '^Umsatzsteuer (?P<satz>\d+(?:[,.]\d+)?) ?%\s*(?P<betrag>\d[\d. ]*[,.] ?\d{2})(?: ?(?:€|EUR))?$'
# Rabatt auf Rechnungsebene (RE0158): ohne Steuersatz gedruckt → nur bei einem Satz eindeutig (Summenabgleich).
# Prozent-Rabatte („Rabatt 10 %“) sind bei Lexware nicht belegt und werden nicht erkannt (→ Summenabgleich schlägt fehl).
nachlaesse: '^abzgl\. (?P<grund>.+?)\s+[-–—]? ?(?P<betrag>\d[\d. ]*[,.] ?\d{2})(?: ?(?:€|EUR))?$'
# Name steht in der Zeile mit „Datum:“, danach optional Ansprechpartner und Liefer-/Leistungsdatum;
# Straße ist die Zeile direkt vor PLZ/Ort.
kaeufer: '^(?P<name>.+?) Datum: \S+\n(?:.*\n)*?(?P<strasse>.+)\n(?P<plz>\d{5}) (?P<ort>.+)$'
positionen:
  # Der Tabellenkopf ist hell auf dunkel; die Texterkennung liest ihn nicht, daher auch der Satz davor
  start: '^Pos\. Bezeichnung Menge Einheit|Unsere Lieferungen/Leistungen stellen wir'
  ende: '^Zwischensumme ?\(netto\)'
  # Pos.-Nr.: ein verlesenes Zeichen (4 → A) wird durch die laufende Nummer ersetzt
  zeile: '^(?:(?P<nr>\d+)|\S) (?P<bezeichnung>.+?) (?P<menge>-?\d[\d.]*(?:,\d+)?) (?P<einheit>\S+) (?P<einzelpreis>-?[\d.]*\d[,.]\d+)(?: ?(?:€|EUR))? (?P<ust_satz>\d+[,.]\d+) (?P<netto>-?[\d.]*\d[,.]\d{2})(?: ?(?:€|EUR))?$'
  ust_satz: 19
  # Seitenumbruch: Zwischensumme/Übertrag, Fußzeile, Seitenzahl, wiederholter Kopf
  ignorieren:
    - '^Zwischensumme\s'
    - '^Übertrag\s'
    - '^Seite \d+/\d+'
    - '^Rechnung \S+$'
    - 'USt-IdNr\.:'
    - 'Steuernummer:'
    - '^IBAN:'
    - '^BIC:'
    - '^\S+@\S+\.\S+$'
    - '^www\.'
    - '^\[|\[.*\['             # Texterkennung: verlesener Tabellenkopf/Zwischensumme mit Rahmen
einheiten:
  Stück: H87
  Stk.: H87
  Stunde: HUR
  Stunden: HUR
  Std.: HUR
  Pauschal: C62
  pauschal: C62
  Kilometer: KMT
  km: KMT
